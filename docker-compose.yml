services:
  postgres:
    image: postgres:16-alpine
    container_name: unidemix
    environment:
      POSTGRES_DB: unidemixdb
      POSTGRES_USER: unidemix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unidemix -d unidemixdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=unidemix;Port=5432;Database=unidemixdb;Username=unidemix;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:-development-only-key-change-in-production-2026!}
      FrontendUrl: http://localhost:3002
      Cors__AllowedOrigins__0: http://localhost:3002
      Cors__AllowedOrigins__1: http://localhost:3003
    ports:
      - "5001:5000"

volumes:
  postgres_data:
