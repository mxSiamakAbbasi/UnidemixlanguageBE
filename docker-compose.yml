services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unidemix
      POSTGRES_USER: unidemix
      POSTGRES_PASSWORD: unidemix_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unidemix -d unidemix"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=unidemix;Username=unidemix;Password=unidemix_dev
      Jwt__Key: ${JWT_KEY:-development-only-key-change-in-production-2026!}
      FrontendUrl: http://localhost:3002
    ports:
      - "5001:5000"

volumes:
  postgres_data:
