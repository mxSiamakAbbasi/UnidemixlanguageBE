services:
  postgres:
    image: postgres:16-alpine
    container_name: unidemix
    environment:
      POSTGRES_DB: unidemixdb
      POSTGRES_USER: unidemix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unidemix -d unidemixdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=unidemix;Port=5432;Database=unidemixdb;Username=unidemix;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:-development-only-key-change-in-production-2026!}
      FrontendUrl: http://localhost:3003
      Cors__AllowedOrigins__0: http://localhost:3003
      SocialStorage__RootPath: /app/uploads/social
    volumes:
      - social_uploads:/app/uploads/social
    ports:
      - "5001:5000"

  frontend:
    build:
      context: ../build-a-complete-frontend-ux-ui
      dockerfile: Dockerfile.dev
    container_name: unidemix-frontend
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001
      WATCHPACK_POLLING: "true"
    volumes:
      - ../build-a-complete-frontend-ux-ui:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  social_uploads:
  frontend_node_modules:
  frontend_next:
